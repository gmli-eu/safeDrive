name: atech_car
board: 14port
libraries:
  - knolleary/PubSubClient@^2.8
modules:
  - {id: st7735_tft,     instance: screen,   ports: [1, 2]}     # check-in menu
  - {id: microphone,     instance: mic,      ports: [3, 4]}     # voice: streams to the hub while listening
  - {id: button,         instance: voicebtn, port: 5}           # press: talk to the car, green while listening
  - {id: button,         instance: sosbtn,   port: 6}           # hold 2 s: Telegram live location
  - {id: neopixel,       instance: grid,     port: 7}
  - {id: icm40608,       instance: imu,      port: 9}           # orientation sensor: crash / flip detection
  - {id: speaker,        instance: spk,      ports: [10, 11]}   # voice: the hub's spoken replies
  - {id: rotary_encoder, instance: knob,     ports: [13, 14]}   # turn: move in the menu, press: select
code:
  globals: |
    #include <WiFi.h>
    #include <PubSubClient.h>
    #include <lwip/sockets.h>
    #include <freertos/stream_buffer.h>

    static const char* WIFI_SSID = "@WIFI_SSID@";   // filled in from secrets.json by make_compose.py
    static const char* WIFI_PASS = "@WIFI_PASS@";
    static const char* MQTT_HOST = "172.20.10.2";   // the Jetson
    static const uint16_t MQTT_PORT = 1883;
    static const unsigned long LONG_PRESS_MS = 2000;

    WiFiClient netClient;
    PubSubClient mqtt(netClient);
    bool lightOn = false;
    String scanReport;
    unsigned long sosFlashAt = 0;   // quick amber double flash when the long press fires

    void logLine(const char* raw) {
      // keep the JSON line valid: printable ASCII only, no quotes/backslashes
      static char msg[400]; size_t j = 0;
      for (size_t i = 0; raw[i] && j < sizeof(msg) - 1; i++) {
        char c = raw[i];
        msg[j++] = (c >= 32 && c <= 126 && c != '"' && c != '\\') ? c : '?';
      }
      msg[j] = 0;
      Serial.printf("{\"type\":\"event\",\"payload\":{\"event_type\":\"log\",\"key\":\"car\",\"value\":\"%s\"}}\n", msg);
    }

    void publishJson(const char* topic, const char* json) {
      if (mqtt.connected()) mqtt.publish(topic, json);
    }

    // ---------- Check-in menu: screen on ports 1-2, knob on ports 13-14 ----------
    // Main menu: "I'm ok". Press it -> choose who to tell. Pressing a recipient sends
    // car/atech/checkin {"to":"mom"|"dad"|"both"}; the hub answers on car/atech/checkin/result.
    enum CheckinMenu { MENU_MAIN, MENU_SEND, MENU_STATUS, MENU_ACCIDENT };
    const char* const MAIN_ITEMS[] = {"I'm ok"};
    const char* const SEND_ITEMS[] = {"Send to mom", "Send to dad", "Send to both", "Go back"};
    const char* const SEND_TO[]    = {"mom", "dad", "both"};
    static const int SEND_BACK = 3;
    static const unsigned long CHECKIN_TIMEOUT_MS = 40000;   // hub's Telegram calls time out at 35 s

    CheckinMenu menu = MENU_MAIN;
    int menuSel = 0;
    bool menuDirty = true;
    String statusTitle, statusBody;
    uint16_t statusColor = ATECH_FG;
    unsigned long statusUntil = 0;     // when the status screen closes; 0 = waiting for the hub
    unsigned long checkinSentAt = 0;   // 0 = no check-in waiting for a result

    // ---------- Accident detection: orientation sensor (IMU) on port 9 ----------
    // Crash: total acceleration over CRASH_G (the sensor tops out at 2 g per axis, about
    // 3.4 g in total). Flip: "down" turns more than FLIP_DEG away from where it was at
    // power-on and stays there for FLIP_HOLD_MS while the board is still (not while the
    // voice button is in use, or for FLIP_VOICE_GRACE_MS after: picking the board up to
    // talk into it looks just like a roll). Either opens a
    // 10 s "ARE YOU OK?" countdown. A knob press cancels it; otherwise car/atech/accident
    // {"kind":"crash"|"flip"} goes to the hub, which alerts every chat with the location.
    enum AccidentKind { ACC_NONE, ACC_CRASH, ACC_FLIP };
    static const float CRASH_G = 2.5f;
    static const float FLIP_DEG = 75.0f;                  // a car on its side is ~90
    static const unsigned long FLIP_HOLD_MS = 3000;
    static const unsigned long FLIP_VOICE_GRACE_MS = 10000;
    static const unsigned long ACCIDENT_COUNTDOWN_MS = 10000;
    static const unsigned long ACCIDENT_REPLY_TIMEOUT_MS = 90000;   // hub may wait 60 s for a location

    bool imuOk = false;
    float downX = 0, downY = 0, downZ = 1;   // unit "down" vector measured at power-on
    AccidentKind accidentKind = ACC_NONE;
    unsigned long accidentAt = 0;            // countdown start
    bool accidentPending = false;            // countdown ran out, not yet handed to the hub
    unsigned long accidentSentAt = 0;        // 0 = no accident alert waiting for the hub's reply
    unsigned long crashQuietUntil = 0;       // ignore jolts until then (after a cancel)
    unsigned long flipSince = 0;             // when the board tipped over; 0 = upright
    bool flipArmed = true;                   // one flip alert per flip: re-armed once upright again
    unsigned long flipPauseUntil = 0;        // voice in use: no flip until then (set by the voice code)

    const char* accidentName(AccidentKind k) { return k == ACC_FLIP ? "flip" : "crash"; }
    int accidentSecondsLeft() {
      unsigned long e = millis() - accidentAt;
      return e >= ACCIDENT_COUNTDOWN_MS ? 0 : (int)((ACCIDENT_COUNTDOWN_MS - e + 999) / 1000);
    }

    void imuBaseline() {
      imuOk = imu.isConnected();
      if (!imuOk) { logLine("imu: no orientation sensor on port 9, accident detection off"); return; }
      imu.setShakeThreshold(CRASH_G);
      delay(200);                            // let the 100 Hz task take its first readings
      float sx = 0, sy = 0, sz = 0;
      for (int i = 0; i < 50; i++) { sx += imu.readAccelX(); sy += imu.readAccelY(); sz += imu.readAccelZ(); delay(10); }
      float m = sqrtf(sx * sx + sy * sy + sz * sz);
      if (m > 1.0f) { downX = sx / m; downY = sy / m; downZ = sz / m; }
      imu.wasShaken();                       // drop anything from power-on handling
      char b[96]; snprintf(b, sizeof b, "imu: %s ready, down=(%.2f, %.2f, %.2f)", imu.getChipName(), downX, downY, downZ);
      logLine(b);
    }

    AccidentKind detectAccident() {
      if (!imuOk) return ACC_NONE;
      bool jolt = imu.wasShaken();           // always read, so an old jolt can't fire later
      float ax = imu.readAccelX(), ay = imu.readAccelY(), az = imu.readAccelZ();
      float m = sqrtf(ax * ax + ay * ay + az * az);
      bool still = fabsf(m - 1.0f) < 0.3f;
      float tilt = 0;
      if (m > 0.01f) {
        float c = (ax * downX + ay * downY + az * downZ) / m;
        tilt = acosf(c > 1 ? 1 : c < -1 ? -1 : c) * 57.2958f;
      }
      bool flipPaused = (long)(millis() - flipPauseUntil) < 0;
      if (still && tilt > FLIP_DEG && !flipPaused) { if (!flipSince) flipSince = millis(); }
      else flipSince = 0;
      if (still && tilt < FLIP_DEG - 20) flipArmed = true;
      if (menu == MENU_ACCIDENT || accidentPending || accidentSentAt) return ACC_NONE;   // one at a time
      if (jolt && (long)(millis() - crashQuietUntil) >= 0) return ACC_CRASH;
      if (flipArmed && flipSince && millis() - flipSince >= FLIP_HOLD_MS) { flipArmed = false; return ACC_FLIP; }
      return ACC_NONE;
    }

    int menuCount() { return menu == MENU_MAIN ? 1 : 4; }
    const char* menuItem(int i) { return menu == MENU_MAIN ? MAIN_ITEMS[i] : SEND_ITEMS[i]; }

    void openMenu(CheckinMenu m) { menu = m; menuSel = 0; menuDirty = true; }

    void showStatus(const char* title, const String& body, uint16_t color, unsigned long ms) {
      menu = MENU_STATUS;
      statusTitle = title; statusBody = body; statusColor = color;
      statusUntil = ms ? millis() + ms : 0;
      menuDirty = true;
    }

    void drawMenu() {
      menuDirty = false;
      int16_t w = screen.width();
      screen.clear();
      if (menu == MENU_ACCIDENT) {
        char n[4]; snprintf(n, sizeof n, "%d", accidentSecondsLeft());
        screen.displayText("POS ACCIDENT DETECTED", 6, 3, 1, ATECH_ALERT);
        screen.displayText("ARE YOU OK?", 6, 16, 2, ATECH_FG);
        screen.displayText(n, 6, 40, 4, ATECH_ALERT);
        screen.fillRoundRect(62, 38, w - 66, 26, 4, ATECH_ACCENT);
        screen.displayText("I'm ok", 74, 43, 2, ATECH_FG);
        screen.displayText("press the knob", 64, 69, 1, ATECH_MUTED);
      } else if (menu == MENU_STATUS) {
        screen.displayText(statusTitle, 6, 8, 2, statusColor);
        screen.setTextSize(1);
        screen.setTextColor(ATECH_MUTED);
        screen.setCursor(6, 36);
        screen.print(statusBody);
      } else {
        screen.displayText(menu == MENU_MAIN ? "SafeDrive" : "I'm ok: tell who?", 6, 3, 1, ATECH_MUTED);
        screen.drawLine(0, 13, w - 1, 13, ATECH_HAIRLINE);
        int n = menuCount();
        uint8_t size = n <= 2 ? 2 : 1;
        int rowH = size == 2 ? 26 : 16;
        for (int i = 0; i < n; i++) {
          int y = 16 + i * rowH;
          if (i == menuSel) screen.fillRoundRect(2, y, w - 4, rowH - 2, 4, ATECH_ACCENT);
          screen.displayText(menuItem(i), 8, y + (rowH - 2 - 8 * size) / 2, size, ATECH_FG);
        }
      }
      screen.display();
    }

    void sendCheckin(int i) {
      if (!mqtt.connected()) {
        showStatus("Offline", "Not connected to the hub. Try again in a moment.", ATECH_ALERT, 4000);
        return;
      }
      char json[48];
      snprintf(json, sizeof json, "{\"to\":\"%s\"}", SEND_TO[i]);
      mqtt.publish("car/atech/checkin", json);
      checkinSentAt = millis();
      showStatus("Sending...", String("I'm ok, to ") + SEND_TO[i], ATECH_FG, 0);
      logLine(json);
    }

    // Hub reply: {"status":"sent"} / {"status":"sent","warning":"no location"} / {"status":"error","reason":"..."}
    void onCheckinResult(const String& p) {
      if (!checkinSentAt) return;      // late reply after the timeout: ignore
      checkinSentAt = 0;
      if (p.indexOf("\"sent\"") >= 0) {
        if (p.indexOf("warning") >= 0) showStatus("Sent", "Sent without location: no recent GPS fix.", ATECH_WARN, 4000);
        else showStatus("Sent", "Message and location delivered.", ATECH_OK, 2500);
      } else {
        String reason = "Unknown error";
        int a = p.indexOf("\"reason\":\"");
        if (a >= 0) { a += 10; int b = p.indexOf('"', a); if (b > a) reason = p.substring(a, b); }
        showStatus("Failed", reason, ATECH_ALERT, 5000);
      }
    }

    // ---------- Voice: button on port 5, mic on ports 3-4, speaker on ports 10-11 ----------
    // Hold the button and talk, or tap it once to start and again to stop. It's green while
    // the mic streams 16 kHz audio to the hub (UDP port 1885, 32 ms per packet); it stops on
    // release (after a hold), on the next tap, or after 20 s. The hub's spoken
    // reply comes back as raw 16 kHz PCM (car/atech/voice/pcm) and plays from a buffer in its
    // own task, so the loop never waits for the speaker. car/atech/voice/status puts text on the screen.
    static const unsigned long VOICE_MAX_MS = 20000;
    static const unsigned long VOICE_HOLD_MS = 600;   // held longer than this: push-to-talk, stop on release
    static const unsigned long VOICE_CHIME_MS = 180;   // the start chime isn't sent to the hub
    // Mic audio goes over UDP, not MQTT: on a busy hotspot a TCP write blocks, and it froze this
    // loop (and the SOS button) for up to 25 s. A UDP packet that doesn't fit is dropped instead.
    // Packet: session id (uint32 LE), sequence number (uint32 LE), 1024 bytes of PCM.
    static const size_t MIC_CHUNK_BYTES = 1024;     // fits one Wi-Fi frame: no IP fragments
    static const uint16_t MIC_UDP_PORT = 1885;
    int micFd = -1;
    uint32_t voiceSid = 0, micSeq = 0;
    StreamBufferHandle_t micBuf = NULL;    // mic task -> loop (0.5 s)
    StreamBufferHandle_t playBuf = NULL;   // MQTT -> playback task (1.5 s; the hub stays 0.6 s ahead)
    volatile bool micOn = false;
    volatile bool playFlush = false;
    bool listening = false;
    bool voiceHeld = false;                // the press that started listening is still down
    unsigned long voicePressAt = 0;
    unsigned long listenAt = 0;

    void onMic(const int16_t* samples, int count, void*) {   // capture task, core 0: copy and return
      size_t n = count * 2;
      if (micOn && micBuf && xStreamBufferSpacesAvailable(micBuf) >= n) xStreamBufferSend(micBuf, samples, n, 0);
    }

    void playTask(void*) {
      static int16_t buf[256];
      for (;;) {
        if (playFlush) {
          while (xStreamBufferReceive(playBuf, buf, sizeof buf, 0) > 0) {}
          playFlush = false;
        }
        size_t n = xStreamBufferReceive(playBuf, buf, sizeof buf, pdMS_TO_TICKS(20));
        if (n >= 2) spk.writeSamples(buf, n / 2);
      }
    }

    // A check-in or accident owns the screen until it's resolved.
    bool screenBusy() { return menu == MENU_ACCIDENT || accidentPending || accidentSentAt || checkinSentAt; }

    void voiceStart() {
      if (!micBuf || !playBuf) { logLine("voice: off, no memory for the audio buffers"); return; }
      if (!mqtt.connected()) {
        if (!screenBusy()) showStatus("Offline", "Not connected to the hub. Try again in a moment.", ATECH_ALERT, 4000);
        return;
      }
      playFlush = true;                      // a new question interrupts the last answer
      uint8_t junk[256];
      while (xStreamBufferReceive(micBuf, junk, sizeof junk, 0) > 0) {}
      if (micFd < 0) {
        micFd = socket(AF_INET, SOCK_DGRAM, IPPROTO_UDP);
        if (micFd >= 0) fcntl(micFd, F_SETFL, fcntl(micFd, F_GETFL, 0) | O_NONBLOCK);
      }
      if (micFd < 0) { logLine("voice: no UDP socket"); return; }
      voiceSid = esp_random(); micSeq = 0;
      char start[48]; snprintf(start, sizeof start, "{\"sr\":16000,\"sid\":%lu}", (unsigned long)voiceSid);
      mqtt.publish("car/atech/voice/start", start);
      listening = true; listenAt = millis();
      voicebtn.setColor(0, 255, 0);
      spk.playNote(NOTE_C5, 70); spk.playNote(NOTE_G5, 90);
      if (!screenBusy()) showStatus("Listening...", "Hey car, send a message to mom, ... / ask Google ... Release, or tap again, to finish.", ATECH_OK, 0);
      logLine("voice: listening");
    }

    void voiceStop(const char* reason) {
      if (!listening) return;
      listening = false; micOn = false;
      voicebtn.off();
      char j[48]; snprintf(j, sizeof j, "{\"reason\":\"%s\"}", reason);
      publishJson("car/atech/voice/end", j);
      bool accident = !strcmp(reason, "accident"), offline = !strcmp(reason, "offline");
      if (!accident) { spk.playNote(NOTE_G5, 60); spk.playNote(NOTE_C5, 90); }
      if (!screenBusy()) {
        if (offline) showStatus("Offline", "Lost the hub while listening. Try again.", ATECH_ALERT, 4000);
        else showStatus("Thinking...", "", ATECH_FG, 30000);
      }
      char b[48]; snprintf(b, sizeof b, "voice: stopped listening (%s)", reason); logLine(b);
    }

    String jsonStr(const String& p, const char* key) {
      String k = String("\"") + key + "\": \"";   // Python's json.dumps puts a space after the colon
      int a = p.indexOf(k);
      if (a < 0) { k = String("\"") + key + "\":\""; a = p.indexOf(k); }
      if (a < 0) return "";
      a += k.length();
      int b = p.indexOf('"', a);
      return b > a ? p.substring(a, b) : "";
    }

    // Hub: {"title": "...", "body": "...", "color": "ok|warn|alert|fg", "ms": 8000}
    void onVoiceStatus(const String& p) {
      if (screenBusy() || listening) return;
      String c = jsonStr(p, "color");
      uint16_t color = c == "ok" ? ATECH_OK : c == "warn" ? ATECH_WARN : c == "alert" ? ATECH_ALERT : ATECH_FG;
      int a = p.indexOf("\"ms\":");
      long ms = a >= 0 ? p.substring(a + 5).toInt() : 0;
      showStatus(jsonStr(p, "title").c_str(), jsonStr(p, "body"), color, ms > 0 ? ms : 8000);
    }

    void startAccident(AccidentKind k) {
      if (listening) voiceStop("accident");  // the countdown needs the driver's attention
      playFlush = true;                      // and silence
      accidentKind = k;
      accidentAt = millis();
      checkinSentAt = 0;                     // a late check-in reply must not replace this screen
      menu = MENU_ACCIDENT; menuDirty = true;
      knob.wasPressed();                     // drop a press from before the accident
      knob.setRingColor(255, 0, 0);
      char b[48]; snprintf(b, sizeof b, "accident: %s detected, 10 s countdown", accidentName(k)); logLine(b);
    }

    void endAccidentCountdown() { knob.setRingColor(10, 132, 255); }

    // Hub reply on car/atech/accident/result: {"status":"sent"} or {"status":"error","reason":"..."}
    void onAccidentResult(const String& p) {
      if (!accidentSentAt) return;
      accidentSentAt = 0;
      if (p.indexOf("\"sent\"") >= 0) showStatus("Alert sent", "Your contacts were asked to call you.", ATECH_WARN, 10000);
      else if (p.indexOf("without location") >= 0) showStatus("Alert sent", "Sent without location: no recent GPS fix.", ATECH_WARN, 10000);
      else {
        String reason = "Unknown error";
        int a = p.indexOf("\"reason\":\"");
        if (a >= 0) { a += 10; int b = p.indexOf('"', a); if (b > a) reason = p.substring(a, b); }
        showStatus("Failed", reason, ATECH_ALERT, 10000);
      }
      logLine(p.indexOf("\"sent\"") >= 0 ? "accident: hub sent the alert" : "accident: hub reported a problem");
    }

    void setLight(bool on) {
      lightOn = on;
      if (on) grid.setAll(255, 255, 255); else grid.clear();
      grid.show();
      if (mqtt.connected()) mqtt.publish("car/atech/light/state", on ? "{\"on\":true}" : "{\"on\":false}", true);
    }

    // Commands from the hub: car/atech/light  {"on":true|false} or "toggle"
    //                        car/atech/notify {"status":"sent"|"error"}
    //                        car/atech/checkin/result (see onCheckinResult)
    //                        car/atech/voice/pcm, /stop, /status (see the voice section)
    void onMqtt(char* topic, byte* payload, unsigned int len) {
      if (!strcmp(topic, "car/atech/voice/pcm")) {   // binary audio: straight into the speaker buffer
        if (playBuf && !(len & 1) && !listening && menu != MENU_ACCIDENT && xStreamBufferSpacesAvailable(playBuf) >= len)
          xStreamBufferSend(playBuf, payload, len, 0);
        return;
      }
      String t(topic), p;
      for (unsigned int i = 0; i < len; i++) p += (char)payload[i];
      if (t == "car/atech/light") {
        if (p.indexOf("toggle") >= 0) setLight(!lightOn);
        else setLight(p.indexOf("true") >= 0);
      } else if (t == "car/atech/notify") {
        // No light either way: the button must stay discreet (no red), so the amber
        // flash at fire time is the only signal. The hub's reply is just logged.
        logLine(p.indexOf("sent") >= 0 ? "sos: hub sent the alert" : "sos: hub reported a problem");
      } else if (t == "car/atech/checkin/result") {
        onCheckinResult(p);
      } else if (t == "car/atech/accident/result") {
        onAccidentResult(p);
      } else if (t == "car/atech/voice/stop") {
        voiceStop("hub");                    // the hub heard the driver finish
      } else if (t == "car/atech/voice/status") {
        onVoiceStatus(p);
      }
    }

    // Non-blocking check that the hub's port answers. mqtt.connect() blocks for up to 3 s
    // when the Jetson isn't on the network (e.g. in the car without it), which froze the
    // knob and buttons. So probe with a non-blocking socket first and only call
    // mqtt.connect() once the Jetson has answered, when it returns at once.
    int probeFd = -1;
    unsigned long probeStartedAt = 0;
    void probeClose() { if (probeFd >= 0) { close(probeFd); probeFd = -1; } }
    bool probeStart() {
      probeClose();
      probeFd = socket(AF_INET, SOCK_STREAM, IPPROTO_TCP);
      if (probeFd < 0) return false;
      fcntl(probeFd, F_SETFL, fcntl(probeFd, F_GETFL, 0) | O_NONBLOCK);
      sockaddr_in addr = {};
      addr.sin_family = AF_INET;
      addr.sin_port = htons(MQTT_PORT);
      addr.sin_addr.s_addr = inet_addr(MQTT_HOST);
      if (connect(probeFd, (sockaddr*)&addr, sizeof addr) < 0 && errno != EINPROGRESS) { probeClose(); return false; }
      probeStartedAt = millis();
      return true;
    }
    // 1 = the hub answered, 0 = still waiting, -1 = failed or timed out (closed).
    int probePoll() {
      if (probeFd < 0) return -1;
      fd_set w; FD_ZERO(&w); FD_SET(probeFd, &w);
      timeval tv = {0, 0};
      if (select(probeFd + 1, NULL, &w, NULL, &tv) > 0) {
        int err = 0; socklen_t len = sizeof err;
        getsockopt(probeFd, SOL_SOCKET, SO_ERROR, &err, &len);
        probeClose();
        return err == 0 ? 1 : -1;
      }
      if (millis() - probeStartedAt > 5000) { probeClose(); return -1; }
      return 0;
    }

    void keepConnected() {
      static unsigned long lastTry = 0;
      if (WiFi.status() != WL_CONNECTED) {
        probeClose();
        if (millis() - lastTry > 15000) {
          lastTry = millis();
          char buf[64]; snprintf(buf, sizeof buf, "wifi: retry, last status=%d", (int)WiFi.status());
          logLine(buf);
          String sr = "wifi scan: " + scanReport;
          logLine(sr.c_str());
          WiFi.disconnect(); WiFi.begin(WIFI_SSID, WIFI_PASS);
        }
        return;
      }
      static bool wifiLogged = false;
      if (!wifiLogged) { wifiLogged = true; char b[64]; snprintf(b, sizeof b, "wifi: connected ip=%s", WiFi.localIP().toString().c_str()); logLine(b); }
      if (!mqtt.connected()) {
        static bool unreachableLogged = false;
        if (probeFd >= 0) {
          int r = probePoll();
          if (r == 1) {
            unreachableLogged = false;
            if (mqtt.connect("atech-car", "car/atech/status", 1, true, "{\"online\":false}")) {
              mqtt.publish("car/atech/status", "{\"online\":true}", true);
              mqtt.subscribe("car/atech/light");
              mqtt.subscribe("car/atech/notify");
              mqtt.subscribe("car/atech/checkin/result");
              mqtt.subscribe("car/atech/accident/result");
              mqtt.subscribe("car/atech/voice/pcm");
              mqtt.subscribe("car/atech/voice/stop");
              mqtt.subscribe("car/atech/voice/status");
              logLine("mqtt: connected");
            } else {
              logLine("mqtt: connect failed");
            }
          } else if (r < 0 && !unreachableLogged) {
            unreachableLogged = true;   // log once, not every retry
            logLine("mqtt: hub not reachable, retrying every 3 s");
          }
        } else if (millis() - lastTry > 3000) {
          lastTry = millis();
          probeStart();
        }
      }
      mqtt.loop();
    }
  setup: |
    WiFi.mode(WIFI_STA);
    // Diagnostics: list visible networks once at boot (ESP32-S3 sees 2.4 GHz only)
    int n = WiFi.scanNetworks();
    scanReport = "";
    for (int i = 0; i < n && i < 12; i++) {
      char buf[64];
      snprintf(buf, sizeof buf, "%s(rssi=%d ch=%d auth=%d) ", WiFi.SSID(i).c_str(), WiFi.RSSI(i), WiFi.channel(i), (int)WiFi.encryptionType(i));
      scanReport += buf;
    }
    if (n <= 0) scanReport = "no networks found";
    WiFi.begin(WIFI_SSID, WIFI_PASS);
    mqtt.setServer(MQTT_HOST, MQTT_PORT);
    mqtt.setCallback(onMqtt);
    mqtt.setSocketTimeout(2);
    mqtt.setBufferSize(4096);          // voice audio: 2-3 KB per message each way
    micBuf = xStreamBufferCreate(16384, 1);
    playBuf = xStreamBufferCreate(49152, 2);
    if (micBuf && playBuf) {
      mic.onAudio(onMic, nullptr);
      xTaskCreatePinnedToCore(playTask, "VoicePlay", 4096, nullptr, 2, nullptr, 0);
    } else logLine("voice: off, no memory for the audio buffers");
    spk.setVolume(0.6f);               // spoken replies over road noise; 1.0 clips
    voicebtn.off();
    grid.clear(); grid.show();
    knob.setAcceleration(false);       // one detent = one menu row
    knob.setRingColor(10, 132, 255);
    imuBaseline();                     // the board must be still in its mounted position at power-on
  loop: |
    // Report loop stalls: anything that blocks here makes the knob and buttons lag.
    static unsigned long lastLoopAt = 0;
    unsigned long loopNow = millis();
    if (lastLoopAt && loopNow - lastLoopAt > 250) {
      char b[48]; snprintf(b, sizeof b, "loop: stalled %lu ms", loopNow - lastLoopAt); logLine(b);
    }
    lastLoopAt = loopNow;

    keepConnected();

    // Scenario 1: the port 5 button and talk ("hey car, ..."). Green while listening.
    // Hold it while talking (stops on release), or tap to start and tap again to stop.
    if (voicebtn.wasPressed()) {
      if (listening) voiceStop("button");
      else { voiceStart(); voiceHeld = listening; voicePressAt = millis(); }
    }
    if (voiceHeld && !voicebtn.isPressed()) {
      voiceHeld = false;
      if (listening && millis() - voicePressAt >= VOICE_HOLD_MS) voiceStop("released");   // a short tap keeps listening
    }
    if (listening) {
      flipPauseUntil = millis() + FLIP_VOICE_GRACE_MS;   // holding the board to talk isn't a roll
      if (!micOn && millis() - listenAt >= VOICE_CHIME_MS) micOn = true;
      static uint8_t pkt[8 + MIC_CHUNK_BYTES];
      static sockaddr_in hubAddr = {};
      hubAddr.sin_family = AF_INET; hubAddr.sin_port = htons(MIC_UDP_PORT); hubAddr.sin_addr.s_addr = inet_addr(MQTT_HOST);
      while (xStreamBufferBytesAvailable(micBuf) >= MIC_CHUNK_BYTES) {
        memcpy(pkt, &voiceSid, 4); memcpy(pkt + 4, &micSeq, 4);   // ESP32 is little-endian
        xStreamBufferReceive(micBuf, pkt + 8, MIC_CHUNK_BYTES, 0);
        sendto(micFd, pkt, sizeof pkt, 0, (sockaddr*)&hubAddr, sizeof hubAddr);   // non-blocking: a full buffer drops it
        micSeq++;
      }
      if (!mqtt.connected()) voiceStop("offline");
      else if (millis() - listenAt > VOICE_MAX_MS) voiceStop("timeout");
    }
    // Re-send the button's light every second: one garbled command over long wires would stick.
    static unsigned long voiceLightAt = 0;
    if (millis() - voiceLightAt > 1000) {
      voiceLightAt = millis();
      if (listening) voicebtn.setColor(0, 255, 0); else voicebtn.off();
    }

    // Scenario 2: hold the port 6 button for 2 s -> long_press event to the hub.
    // Light: two amber flashes when it fires, otherwise off (never red: it must stay discreet).
    // (The white light while pressed is built into the V2.0 button; firmware can't turn it off.)
    static unsigned long sosDownAt = 0;
    static bool sosFired = false;
    bool sosDown = sosbtn.isPressed();
    if (sosDown && sosDownAt == 0) { sosDownAt = millis(); sosFired = false; }
    if (!sosDown) { sosDownAt = 0; }
    if (sosDown && !sosFired) {
      unsigned long held = millis() - sosDownAt;
      if (held >= LONG_PRESS_MS) {
        sosFired = true;
        publishJson("car/atech/button", "{\"id\":\"sos\",\"port\":6,\"action\":\"long_press\",\"held_ms\":2000}");
        sosFlashAt = millis();
        logLine("sos: long press");
      }
    }
    // Keep the light off outside the amber flash. Re-sent every second, because one
    // garbled "off" (e.g. over long jumper wires) would otherwise leave it lit.
    static unsigned long sosOffAt = 0;
    if (!sosFlashAt && millis() - sosOffAt > 1000) { sosOffAt = millis(); sosbtn.off(); }

    // Fired: two quick amber flashes (120 ms on/off) so the driver knows they can let go.
    if (sosFlashAt) {
      unsigned long e = millis() - sosFlashAt;
      static int lastPhase = -1;
      int phase = e < 120 ? 0 : e < 240 ? 1 : e < 360 ? 2 : 3;
      if (phase != lastPhase) {
        lastPhase = phase;
        if (phase == 0 || phase == 2) sosbtn.setColor(255, 120, 0); else sosbtn.off();
      }
      if (phase == 3) { sosFlashAt = 0; lastPhase = -1; }
    }

    // Scenario 3: check-in menu. Turn the knob to move, press it to select.
    static long knobLast = knob.getPosition();
    long knobPos = knob.getPosition();
    long steps = knobLast - knobPos;   // the knob counts down when turned right; right = move down
    knobLast = knobPos;
    if (steps && (menu == MENU_MAIN || menu == MENU_SEND)) {
      menuSel = constrain(menuSel + (int)steps, 0, menuCount() - 1);
      menuDirty = true;
    }

    // Scenario 4: crash or flip -> "ARE YOU OK?" countdown; no knob press in 10 s -> alert.
    AccidentKind detected = detectAccident();
    if (detected != ACC_NONE) startAccident(detected);
    bool knobPressed = knob.wasPressed();
    if (menu == MENU_ACCIDENT) {
      if (knobPressed) {
        knobPressed = false;             // used up here, not by the menu below
        endAccidentCountdown();
        crashQuietUntil = millis() + 3000;
        logLine("accident: driver pressed I'm ok, no alert");
        showStatus("Cancelled", "Glad you're ok. No alert was sent.", ATECH_OK, 3000);
      } else if (accidentSecondsLeft() == 0) {
        endAccidentCountdown();
        accidentPending = true;
        showStatus("Alerting...", "Sending the accident alert. Press the knob to cancel.", ATECH_ALERT, 0);
      } else {
        static int shownSec = -1;
        int sec = accidentSecondsLeft();
        if (sec != shownSec || menuDirty) { shownSec = sec; menuDirty = true; }
      }
    } else if (knobPressed && accidentPending) {
      knobPressed = false;               // not handed to the hub yet: the driver can still stop it
      accidentPending = false;
      logLine("accident: cancelled before it reached the hub");
      showStatus("Cancelled", "No alert was sent.", ATECH_OK, 3000);
    }
    if (accidentPending && mqtt.connected()) {
      char json[40]; snprintf(json, sizeof json, "{\"kind\":\"%s\"}", accidentName(accidentKind));
      mqtt.publish("car/atech/accident", json);
      accidentPending = false;
      accidentSentAt = millis();
      showStatus("Alerting...", "Telling your contacts...", ATECH_ALERT, 0);
      logLine(json);
    }
    if (accidentSentAt && millis() - accidentSentAt > ACCIDENT_REPLY_TIMEOUT_MS) {
      accidentSentAt = 0;
      showStatus("No reply", "The hub didn't confirm the accident alert.", ATECH_ALERT, 10000);
    }

    if (knobPressed) {
      if (menu == MENU_MAIN) openMenu(MENU_SEND);
      else if (menu == MENU_SEND) { if (menuSel == SEND_BACK) openMenu(MENU_MAIN); else sendCheckin(menuSel); }
      else if (statusUntil) openMenu(MENU_MAIN);   // a press closes a result early
    }
    if (menu == MENU_STATUS) {
      if (statusUntil && millis() > statusUntil) openMenu(MENU_MAIN);
      if (checkinSentAt && millis() - checkinSentAt > CHECKIN_TIMEOUT_MS) {
        checkinSentAt = 0;
        showStatus("No reply", "The hub didn't answer. Is it running?", ATECH_ALERT, 5000);
      }
    }
    if (menuDirty) drawMenu();
